name: Self-play image

# ghcr.io/arcanite24/playmat-selfplay (ops/web/Dockerfile.selfplay): the Rust AI's self-play worker for the public
# server's idle hours (ops/web/host/rl-worker.sh). arm64 only, built on GitHub's arm64 runner. Tags: sha-<7> always,
# master for master's latest commit. Branches under rust-ai/ build too, so a training branch can run on the box
# before it is merged; the worker always runs an image by digest.
on:
  push:
    branches: [ "master", "rust-ai/**" ]
    paths:
      - "rust/**"
      - "archbench/constructed-2/**"
      - "ops/web/Dockerfile.selfplay"
      - ".github/workflows/selfplay-image.yml"
  workflow_dispatch:

concurrency:
  group: selfplay-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: playmat-selfplay (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - id: tags
        name: Tags
        run: |
          image=ghcr.io/arcanite24/playmat-selfplay
          tags="$image:sha-${GITHUB_SHA::7}"
          [ "$GITHUB_REF" = refs/heads/master ] && tags="$tags,$image:master"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/web/Dockerfile.selfplay
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=playmat-selfplay
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=selfplay
          cache-to: type=gha,scope=selfplay,mode=max
      - name: Digest
        run: echo "ghcr.io/arcanite24/playmat-selfplay:sha-${GITHUB_SHA::7}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
