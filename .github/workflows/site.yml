name: Site

# Publishes site/ (the project website) to GitHub Pages.
on:
  push:
    branches: [ "master" ]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
      # the Rust tracker (site/rust/) counts these
      - "docs/rust/**"
      - "rust/tools/progress*"
      - "rust/crates/playmat-engine/cards/**"
      - "rust/crates/playmat-engine/shadow/**"
      - "rust/crates/playmat-engine/shadow-decks/**"
      - "Mage.Web.Client/public/meta-decks/**"
      - "Mage.Server/career-src/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Count the Rust port's progress
        run: python3 rust/tools/progress.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
