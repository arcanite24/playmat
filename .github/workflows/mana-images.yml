name: Mana@Home images

# ghcr.io/arcanite24/mana-worker and mana-coordinator (ops/swarm/): the swarm's strict worker and its coordinator,
# for amd64 and arm64, each built natively on its own runner (no emulation: the worker's strict build must be the
# real thing on both). Tags: sha-<7> always, latest for master's latest commit.
on:
  push:
    branches: [ "master" ]
    paths:
      - "rust/**"
      - "!rust/rl/**"
      - "rust/rl/infer_server.py"
      - "rust/rl/model.py"
      - "rust/rl/train.py"
      - "rust/rl/data.py"
      - "archbench/**"
      - "Mage.Server/career-src/**"
      - "ops/swarm/**"
      - ".github/workflows/mana-images.yml"
  workflow_dispatch:

concurrency:
  group: mana-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [ mana-worker, mana-coordinator ]
        arch: [ amd64, arm64 ]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: mana-worker
            file: ops/swarm/Dockerfile.worker
          - image: mana-coordinator
            file: ops/swarm/Dockerfile.coordinator
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/arcanite24/${{ matrix.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          build-args: REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max

  manifest:
    name: ${{ matrix.image }} (multi-arch)
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [ mana-worker, mana-coordinator ]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        run: |
          image=ghcr.io/arcanite24/${{ matrix.image }}
          tags="-t $image:sha-${GITHUB_SHA::7}"
          [ "$GITHUB_REF" = refs/heads/master ] && tags="$tags -t $image:latest"
          docker buildx imagetools create $tags "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$image:sha-${GITHUB_SHA::7}" | tee -a "$GITHUB_STEP_SUMMARY"

  worker-gpu:
    name: mana-worker-gpu (amd64 CUDA)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/swarm/Dockerfile.worker-gpu
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/arcanite24/mana-worker-gpu:sha-${{ github.sha }}
            ghcr.io/arcanite24/mana-worker-gpu:latest
          build-args: REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=mana-worker-gpu
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=mana-worker-gpu-amd64
          cache-to: type=gha,scope=mana-worker-gpu-amd64,mode=max
