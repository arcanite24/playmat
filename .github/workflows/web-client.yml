name: Web client

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - "Mage.Web.Client/**"
      - ".github/workflows/web-client.yml"
  pull_request:
    paths:
      - "Mage.Web.Client/**"
      - ".github/workflows/web-client.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mage.Web.Client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: Mage.Web.Client/.nvmrc
          cache: npm
          cache-dependency-path: Mage.Web.Client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # fails when the app's JS grows past the budget in scripts/check-bundle-size.mjs; prints the sizes
      - run: npm run size

  # Playwright: the specs that need no game server (sign-in, axe on the sign-in screen) against the
  # production build served by `vite preview`. Specs that play on a live server skip here (they need
  # MAGE_E2E_REQUIRE_SERVER=1 and a running Java server); see Mage.Web.Client/README.md to run them.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Mage.Web.Client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: Mage.Web.Client/.nvmrc
          cache: npm
          cache-dependency-path: Mage.Web.Client/package-lock.json
      - run: npm ci
      # the browser download (about 170 MB) is cached per Playwright version; the system packages it needs aren't
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run build
      - run: npm run test:e2e:ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            Mage.Web.Client/playwright-report
            Mage.Web.Client/test-results
          retention-days: 7
