name: Rust

# The Rust workspace (rust/, docs/RustMigration.md): format, lints and tests for every branch and PR that touches it.
# methods.json is generated from the Java bridge; WebClientApiDocsTest (web-bridge.yml) fails when it is stale.
# Branch pushes are covered by their PR (push runs only on master, so a PR doesn't run this twice).
# Run the same checks locally before pushing: ops/ci/check.sh (the .githooks/pre-push hook does).
on:
  push:
    branches: [ "master" ]
    paths:
      - "rust/**"
      - "Mage.Web.Client/src/core/rpc/__fixtures__/gameStatePatches.json"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "Mage.Web.Client/src/core/rpc/__fixtures__/gameStatePatches.json"
      - ".github/workflows/rust.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      # keyed on the toolchain and Cargo.lock, saved after every run and pruned of stale artifacts (a plain
      # actions/cache keyed on Cargo.lock alone never refreshed rust/target until the lock file changed)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
