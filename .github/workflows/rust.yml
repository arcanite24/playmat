name: Rust

# The Rust workspace (rust/, docs/RustMigration.md): format, lints and tests for every branch and PR that touches it.
# methods.json is generated from the Java bridge; WebClientApiDocsTest (web-bridge.yml) fails when it is stale.
on:
  push:
    paths:
      - "rust/**"
      - "Mage.Web.Client/src/core/rpc/__fixtures__/gameStatePatches.json"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "Mage.Web.Client/src/core/rpc/__fixtures__/gameStatePatches.json"
      - ".github/workflows/rust.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
