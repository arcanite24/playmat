# /etc/playmat-deploy.conf: read by playmat-deploy and playmat-compose (setup-deploy-user.sh installs it once and then
# leaves it alone). Root-owned, readable by the deploy group.

# Where the stack runs from: .env (the stack's settings, as in ops/web/.env.example), releases/<tag>-<digest>/ (the
# compose kit each deployed server image carried) and current, a link to the running one.
COMPOSE_DIR=/srv/playmat
# The compose project: its volumes are <project>_xmage-db and so on. A stack started from a checkout's ops/web is "web".
COMPOSE_PROJECT=web

# The published images (.github/workflows/images.yml)
SERVER_REPO=ghcr.io/arcanite24/playmat-server
WEB_REPO=ghcr.io/arcanite24/playmat-web
# Only when the GHCR packages are private: a token that can read them (classic PAT with read:packages) and its user.
GHCR_USER=
GHCR_TOKEN=

# Database snapshots taken before every deploy and rollback; the newest SNAPSHOT_KEEP stay.
SNAPSHOT_DIR=/var/backups/playmat
SNAPSHOT_KEEP=5
# How long running games get to finish before the restart, in minutes.
DRAIN_MINUTES=15
# How long the new version gets to be healthy (xmage, web, https://$DOMAIN/ answering 200), in seconds.
HEALTH_TIMEOUT=300
# current and previous versions (state), the lock and deploy.log
STATE_DIR=/var/lib/playmat-deploy
