[package]
name = "playmat-swarm"
description = "Mana@Home's coordinator (docs/swarm/Design.md): leases work units, presigns uploads, takes results in"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# the protocol only, never playmat-ai: a workspace build must not unify the AI's strict feature into a server
[dependencies]
playmat-swarm-proto = { path = "../playmat-swarm-proto" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
