[package]
name = "playmat-platform"
description = "The platform service (Rust migration phase 2): calls the gateway answers in Rust, starting with the card catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util.workspace = true
playmat-protocol = { path = "../playmat-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"
url = "2"
encoding_rs = "0.8"
scraper = { version = "0.24", default-features = false }
ego-tree = "0.10"
