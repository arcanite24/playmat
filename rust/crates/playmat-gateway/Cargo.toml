[package]
name = "playmat-gateway"
description = "Owns the browser's WebSocket and routes each call to the Java server or to Rust (Rust migration phase 1)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "playmat-gateway"
path = "src/main.rs"

[dependencies]
playmat-protocol = { path = "../playmat-protocol" }
playmat-statediff = { path = "../playmat-statediff" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
axum = "0.8"
yawc = { version = "0.5", default-features = false, features = ["axum", "zlib"] }
http = "1"
bytes = "1"
url = "2"
async-trait = "0.1"
