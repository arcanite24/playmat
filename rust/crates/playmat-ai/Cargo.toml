[package]
name = "playmat-ai"
description = "Rust AI for Playmat (docs/RustMigration.md, phase 5): search over the Rust engine's cheap game copies"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
playmat-engine = { path = "../playmat-engine" }
matrixmultiply = "0.3"
sha2 = "0.10"
libm = { version = "0.2", optional = true }
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }
serde.workspace = true
serde_json.workspace = true

[features]
# the same games on every machine: fixed-order matrix products and portable float functions (src/fm.rs)
strict = ["dep:libm"]
# optional native Rust GPU compute backend (Metal / Vulkan / DX12 via wgpu, zero Python dependency)
gpu-wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
